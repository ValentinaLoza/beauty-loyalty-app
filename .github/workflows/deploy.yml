name: Deploy

# Publishes the web app to Cloudflare Pages when main changes.
#
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN   (Cloudflare token with "Pages: Edit")
#              CLOUDFLARE_ACCOUNT_ID
#   Variables: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, APP_TITLE,
#              APP_SHORT_NAME, THEME_COLOR, WEB_PUSH_VAPID_PUBLIC_KEY,
#              CLOUDFLARE_PAGES_PROJECT   (e.g. bellamialashesstudio)
# Until the secrets exist, this workflow skips the deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check configuration
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: subosito/flutter-action@v2
        if: env.HAS_TOKEN == 'true'
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Write config
        if: env.HAS_TOKEN == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          APP_TITLE: ${{ vars.APP_TITLE }}
          APP_SHORT_NAME: ${{ vars.APP_SHORT_NAME }}
          THEME_COLOR: ${{ vars.THEME_COLOR }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ vars.WEB_PUSH_VAPID_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          keys = ["SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY", "APP_TITLE",
                  "APP_SHORT_NAME", "THEME_COLOR", "WEB_PUSH_VAPID_PUBLIC_KEY"]
          config = {k: os.environ.get(k, "") for k in keys}
          missing = [k for k in keys[:3] if not config[k]]
          if missing:
              raise SystemExit(f"Missing repository variables: {missing}")
          json.dump(config, open("config/local.json", "w"), indent=2)
          PY
      - name: Build
        if: env.HAS_TOKEN == 'true'
        run: ./scripts/build_web.sh config/local.json
      - name: Publish to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy build/web
          --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
          --branch=main
